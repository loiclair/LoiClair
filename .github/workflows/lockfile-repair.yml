# Répare un `package-lock.json` que `npm ci` refuse sur Linux, et pousse le correctif
# sur `main`.
#
# Le cas visé : une majeure npm appliquée depuis `/done`, donc sur macOS. npm y
# élague du lockfile les paquets optionnels propres à Linux, et `npm ci` échoue
# ensuite dans `ci.yml`. Régénérer ici, sur Linux, rend un lockfile complet.
#
# Pas de boucle : le commit poussé déclenche ce workflow une seconde fois, qui trouve
# un `npm ci` qui passe et s'arrête sans rien pousser.
name: Lockfile repair

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

# Partagé avec `deps-weekly.yml` : les deux poussent `package-lock.json` sur `main`.
concurrency:
  group: deps-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      # LOCKFILE_PAT et pas GITHUB_TOKEN : un push fait avec GITHUB_TOKEN ne déclenche
      # pas `ci.yml`, et `/release` refuse de publier un dernier commit sans CI verte.
      # Si le PAT expire, ce checkout échoue bruyamment.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.LOCKFILE_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Un vrai `npm ci` et pas `--dry-run` : rien n'a prouvé que le mode simulé
      # détecte les paquets Linux absents du lockfile.
      - name: Detect lockfile drift
        id: check
        run: |
          if npm ci --ignore-scripts; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate lockfile
        if: steps.check.outputs.needs_fix == 'true'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts

      - name: Commit and push the repaired lockfile
        if: steps.check.outputs.needs_fix == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): régénérer package-lock.json sur Linux"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
